<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Raven's Priorities">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-180.png">

<title>Raven's Priorities</title>

<style>
/* Layout: one-column phone app, sticky header, fixed bottom nav, sheets slide over content */
:root{
  --ink:#111114;--muted:#5f5f66;--line:#dcdcdf;--soft:#f1f1f3;--paper:#ffffff;
  --op:.85;--card:rgba(255,255,255,var(--op));--danger:#b42318;
  --display:'Space Mono',ui-monospace,Menlo,monospace;
  --body:'Onest',-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:12px;color-scheme:light;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{background:var(--paper) center/cover no-repeat fixed;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
.app{max-width:520px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px));min-height:100%}
.top{position:relative;gap:6px!important;padding:14px 0 10px;display:flex;align-items:center;gap:14px;background:transparent}
.top h1{font-family:var(--display);font-size:clamp(17px,5vw,22px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;margin:0;flex:1;min-width:0;text-wrap:balance}
.ib{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px}
.ib:focus-visible,.btn:focus-visible,.nav button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ib svg{width:24px;height:24px}
.ib.dim{color:#9a9aa1}.ib.dim svg{width:21px;height:21px}
svg.i{display:block;width:22px;height:22px;flex:none}
.seg{display:flex;border:1px solid var(--ink);border-radius:12px;padding:3px;background:var(--card)}
.seg button{flex:1;padding:7px 0;border-radius:9px;font-size:14px}
.seg button.on{background:var(--ink);color:#fff}
.stack{display:flex;flex-direction:column;gap:10px}
.cap{font-size:13px;color:var(--muted)}
.mono{font-family:var(--display)}
.panel{background:var(--card);border-radius:16px;padding:12px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}
.dow{font-family:var(--display);font-size:12px;color:var(--muted);margin-bottom:4px}
.grid{row-gap:2px;font-family:var(--display);font-size:13px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0}
.day .n{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.day.today .n{outline:1px solid var(--ink)}
.day.sel .n{background:var(--ink);color:#fff}
.day .dots{display:flex;gap:2px;height:6px}
.dot{width:6px;height:6px;border-radius:50%}
.ring{width:6px;height:6px;border-radius:50%;border:1.5px solid}
.mini .day .n{width:26px;height:26px;font-size:12px;border-radius:8px}
.chip{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;text-align:left;width:100%}
.chip .t{font-family:var(--display);font-size:13px;min-width:44px;opacity:.9}
.chip .x{flex:1;min-width:0;overflow-wrap:anywhere}
.chip svg{width:18px;height:18px;flex:none}
.chip.once{background:var(--card);border:1.5px dashed}
.empty{padding:18px 12px;text-align:center;color:var(--muted);font-size:14px;background:var(--card);border-radius:12px}
.wk{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;align-items:start}
.wk .lbl{font-family:var(--display);font-size:13px;padding-top:10px;line-height:1.3}
.subj{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;width:100%;text-align:left;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.subj .ico{width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center}
.subj .ico svg{width:28px;height:28px}
.subj .ico img{width:34px;height:34px;object-fit:cover;border-radius:9px}
.subj>svg.i{width:20px;height:20px;opacity:.7}
.subj .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.subj .nm{font-weight:600;font-size:16px}
.subj .sub{font-size:13px;opacity:.85}
.task{display:flex;align-items:stretch;border-radius:12px;border:1px solid var(--line);background:var(--card);overflow:hidden}
.task.done{border-color:transparent}
.task .ck{flex:none;width:52px;display:flex;align-items:center;justify-content:center}
.task .ck span{width:24px;height:24px;border-radius:7px;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center}
.task .ck svg{width:16px;height:16px}
.task .bd{flex:1;min-width:0;text-align:left;padding:12px 12px 12px 0;display:flex;flex-direction:column;gap:2px}
.task .tp{font-weight:600;overflow-wrap:anywhere}
.task .mt,.task .stp{font-size:13px;opacity:.85}
.task .stp{display:flex;gap:5px;align-items:center}
.task .stp svg{width:14px;height:14px}
.srch input{display:block;width:100%;border:1px solid var(--ink);border-radius:12px;padding:10px 12px;font-size:16px;background:var(--card);-webkit-appearance:none;appearance:none}
.nrow{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.nrow .tp{font-weight:600;overflow-wrap:anywhere}
.nrow .sub{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;overflow-wrap:anywhere}
.nrow .meta{display:flex;gap:10px;font-size:12px;color:var(--muted)}
.nrow mark,.nrow .sub mark{background:#E1CBD7;color:inherit;border-radius:3px;padding:0 1px}
.art{display:flex;flex-direction:column;gap:14px;padding-bottom:24px}
.art .ntitle{font-family:var(--display);font-size:24px;line-height:1.2;margin:0;overflow-wrap:anywhere}
.art .nsrc{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.art .nsrc a{color:var(--ink)}
.ntext{font-size:16px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.ntext a{color:var(--ink);text-decoration:underline}
.nimg{display:block;width:100%;border-radius:12px;background:var(--soft)}
.nimg.ph{height:160px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
.nfile{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.nfile .fn{flex:1;min-width:0}.nfile .fn div:first-child{overflow-wrap:anywhere}
.btn.sm{width:auto;padding:8px 12px;font-size:14px}
.btn-done{font-weight:600;padding:8px 12px;border-radius:10px;background:var(--ink);color:#fff;font-size:15px}
.blk{display:flex;flex-direction:column;gap:6px}
.btools{display:flex;justify-content:flex-end;gap:4px}
.btools button{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:var(--soft)}
.btools svg{width:18px;height:18px}
.addrow{display:flex;gap:8px}
.addrow button,.addrow label{flex:1;text-align:center;padding:9px;border:1px dashed var(--ink);border-radius:10px;font-size:14px;cursor:pointer}
.editor{min-height:220px;border:1px solid var(--ink);border-radius:10px;padding:12px;background:#fff;font-size:16px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;outline:none;-webkit-user-select:text;user-select:text}
.editor:empty:before{content:attr(data-ph);color:#9a9aa1}
.editor img{display:block;width:100%;height:auto;border-radius:10px;margin:8px 0}
.edbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.edbar label{font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:9px;cursor:pointer;white-space:nowrap}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.gal .g{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--soft)}
.gal .g img{width:100%;height:100%;object-fit:cover;display:block}
.gal .g button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center}
.gal .g button svg{width:16px;height:16px}
.rrow{cursor:default}
.rrow.drag{position:relative;z-index:3;box-shadow:0 10px 24px rgba(0,0,0,.28);transform:scale(1.02)}
.grip{flex:none;width:44px;height:44px;margin:-8px -6px -8px 0;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;border-radius:10px}
.grip svg{width:24px;height:24px}
.zoom{position:fixed;inset:0;z-index:50;background:#000;overflow:auto;-webkit-overflow-scrolling:touch}
.zoom img{display:block;width:100%;margin:auto;min-height:100%;object-fit:contain}
.zoom.big img{width:260%;max-width:none;min-height:0}
.zoom .zx{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);color:#111;display:flex;align-items:center;justify-content:center;z-index:51}
.lesson{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:11px 12px;border-radius:12px;width:100%;text-align:left}
.lesson .d{font-family:var(--display);font-size:13px;line-height:1.35}
.lesson .tp{font-weight:600}
.lesson .mt{font-size:13px}
.lesson .stp{font-size:13px;display:flex;gap:5px;align-items:center}
.lesson .stp svg{width:14px;height:14px}
.total{background:var(--card);border:1px solid var(--ink);border-radius:14px;padding:14px}
.total .v{font-family:var(--display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.cat{display:grid;grid-template-columns:128px minmax(0,1fr) 72px;align-items:center;gap:8px;font-size:14px}
.bar{height:10px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%}
.num{font-family:var(--display);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.tx{display:flex;justify-content:space-between;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.tx .a{font-family:var(--display);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:520px;margin:0 auto;display:flex;justify-content:space-around}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:#9a9aa1;min-width:58px;padding:4px 0;border-radius:10px}
.nav button svg{width:28px;height:28px}
.nav button.on{color:var(--ink);font-weight:600}
.wrow .en{font-family:var(--display);font-weight:700;font-size:16px;overflow-wrap:anywhere}
.wrow .ru{font-size:14px;overflow-wrap:anywhere}
.wrow .syn{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.wrow mark{background:#E1CBD7;color:inherit;border-radius:3px;padding:0 1px}
.wletter{font-family:var(--display);font-size:13px;font-weight:700;color:var(--muted);padding:6px 2px 0}
.wlbl{font-family:var(--display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.wen{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.15;margin:0;overflow-wrap:anywhere}
.wru{font-size:19px;line-height:1.35;overflow-wrap:anywhere}
.wchips{display:flex;flex-wrap:wrap;gap:6px}
.wchip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:7px 12px;border-radius:10px;border:1px solid var(--ink);background:var(--card);font-size:15px;font-family:var(--display);overflow-wrap:anywhere;text-align:left}
.wchip.ant{border-style:dashed}
.wchip.add{font-family:var(--body);font-size:14px;border-style:dashed;color:var(--muted);border-color:var(--muted)}
.wchip .rm{display:flex;margin:-6px -8px -6px 0;width:30px;height:30px;align-items:center;justify-content:center;border-radius:8px}
.wchip .rm svg{width:16px;height:16px}
.scrim{position:fixed;inset:0;background:rgba(17,17,20,.35);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:92%;overflow-y:auto;overflow-x:hidden;background:#fff;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet.full{top:0;max-height:none;height:100%;border-radius:0;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.f textarea{display:block;width:100%;min-width:0;border:1px solid var(--ink);border-radius:10px;padding:10px 11px;background:#fff;font-size:16px;line-height:1.45;min-height:56px;resize:none;overflow:hidden;-webkit-appearance:none;appearance:none}
.f .lnk{display:inline-block;margin-top:6px;font-size:14px;color:var(--ink)}
.task .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.sheet .in{width:100%;min-width:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-family:var(--display);font-size:20px;margin:0;flex:1}
.f label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.f input,.f select{display:block;width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;border:1px solid var(--ink);border-radius:10px;padding:10px 11px;background:#fff;font-size:16px;min-height:44px}
.f input[type=date],.f input[type=time]{text-align:left}
.f input::-webkit-date-and-time-value{text-align:left}
.row2>*,.row3>*{min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.days button{border:1px solid var(--ink);border-radius:9px;padding:9px 0;font-family:var(--display);font-size:12px}
.days button.on{background:var(--ink);color:#fff}
.sw{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw button{width:34px;height:34px;border-radius:10px;border:1px solid rgba(0,0,0,.15)}
.sw button.on{outline:2px solid var(--ink);outline-offset:2px}
.sw input[type=color]{width:34px;height:34px;border:1px dashed var(--ink);border-radius:10px;padding:2px;background:#fff}
.preview{font-size:15px}
.btn{border-radius:12px;padding:13px;text-align:center;font-size:15px;width:100%}
.btn.pri{background:var(--ink);color:#fff}
.btn.ghost{border:1px solid var(--ink)}
.btn.del{color:var(--danger)}
.pack{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.pack button{aspect-ratio:1;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center}
.pack button svg{width:24px;height:24px}
.pack button.on{outline:2px solid var(--ink);outline-offset:1px}
.thumb{width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.thumb svg{width:30px;height:30px}.thumb img{width:100%;height:100%;object-fit:cover}
.bgprev{height:200px;border-radius:14px;background:var(--soft) center/cover no-repeat;display:flex;align-items:flex-end;padding:10px 12px;font-size:13px}
.range{width:100%;accent-color:var(--ink)}
.note{font-size:13px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;z-index:40}
@media (max-width:380px){.cat{grid-template-columns:104px minmax(0,1fr) 64px}.pack{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>

  <div class="empty">Загружаю ваш план, уроки и траты…</div>
</div>

  <button id="nav-lessons" data-act="view" data-v="lessons"></button>
  <button id="nav-interests" data-act="view" data-v="interests"></button>
  <button id="nav-words" data-act="view" data-v="words"></button>
  <button id="nav-money" data-act="view" data-v="money"></button>
</div></nav>
<div id="layer"></div>

  tomb:{events:{},subjects:{},lessons:{},expenses:{},ifolders:{},notes:{},words:{},wlinks:{}},

let sheet=null;

function occurs(e,d){
  if(e.type==='once')return e.date===d;
  if(e.start&&d<e.start)return false;
  if(e.until&&d>e.until)return false;
  return (e.days||[]).includes(m0(parse(d)));
}
const eventsOn=d=>st.data.events.filter(e=>occurs(e,d)).sort((a,b)=>(a.from||'99').localeCompare(b.from||'99'));

function dots(d){
  const ev=eventsOn(d).slice(0,3);
  return ev.map(e=>e.type==='once'?'<i class="ring" style="border-color:'+esc(e.color)+'"></i>':'<i class="dot" style="background:'+esc(e.color)+'"></i>').join('');
}
function monthGrid(y,m,mini){
  const first=new Date(y,m,1),n=new Date(y,m+1,0).getDate();let h='<div class="grid'+(mini?' mini':'')+'">';
  for(let i=0;i<m0(first);i++)h+='<span></span>';
  for(let i=1;i<=n;i++){const d=ymd(new Date(y,m,i));h+='<button class="day'+(d===st.sel?' sel':'')+(d===today()?' today':'')+'" data-act="sel" data-d="'+d+'" aria-label="'+esc(dLong(d))+'"><span class="n">'+i+'</span><span class="dots">'+dots(d)+'</span></button>'}
  return h+'</div>';
}
function chip(e){
  const c=e.color||P[0];const t=e.from?esc(e.from):'—';
  if(e.type==='once')return '<button class="chip once" style="border-color:'+esc(c)+'" data-act="edit-ev" data-id="'+e.id+'"><span class="t">'+t+'</span><span class="x">'+esc(e.title)+'</span>'+ico('point')+'</button>';
  return '<button class="chip" style="background:'+esc(c)+';color:'+onC(c)+'" data-act="edit-ev" data-id="'+e.id+'"><span class="t">'+t+'</span><span class="x">'+esc(e.title)+'</span>'+ico('repeat')+'</button>';
}
function dayList(d){
  const ev=eventsOn(d);
  return '<div class="cap" style="padding-top:4px">'+esc(dLong(d))+'</div>'+(ev.length?'<div class="stack" style="gap:7px">'+ev.map(chip).join('')+'</div>':'<div class="empty">На этот день ничего нет. Нажмите «+», чтобы добавить событие.</div>');
}

function vPlan(){
  const c=parse(st.cur);let title,body;
  if(st.mode==='week'){
    const ws=weekStart(parse(st.sel)),we=addD(ws,6);
    title=ws.getDate()+' '+(ws.getMonth()!==we.getMonth()?MONG[ws.getMonth()]+' ':'')+'– '+we.getDate()+' '+MONG[we.getMonth()];
    body='<div class="stack">'+[0,1,2,3,4,5,6].map(i=>{const d=ymd(addD(ws,i)),ev=eventsOn(d);return '<div class="wk"><button class="lbl" data-act="sel" data-d="'+d+'" style="text-align:left'+(d===today()?';font-weight:700':'')+'">'+DOW[i]+'<br>'+dNum(d)+'</button><div class="stack" style="gap:6px">'+(ev.length?ev.map(chip).join(''):'<div class="cap" style="padding:10px 0">—</div>')+'</div></div>'}).join('')+'</div>';
  }else if(st.mode==='month'){
    title=MON[c.getMonth()]+' '+c.getFullYear();
    body='<div class="panel"><div class="dow">'+DOW.map(x=>'<span>'+x+'</span>').join('')+'</div>'+monthGrid(c.getFullYear(),c.getMonth())+'</div>'+legend()+dayList(st.sel);
  }else{
    const ms=[0,1,2].map(i=>new Date(c.getFullYear(),c.getMonth()+i,1));
    title=MON[ms[0].getMonth()].slice(0,3)+' – '+MON[ms[2].getMonth()].slice(0,3)+' '+ms[2].getFullYear();
    body=ms.map(m=>'<div class="panel"><div class="mono" style="font-weight:700;margin-bottom:6px">'+MON[m.getMonth()]+'</div><div class="dow">'+DOW.map(x=>'<span>'+x+'</span>').join('')+'</div>'+monthGrid(m.getFullYear(),m.getMonth(),1)+'</div>').join('')+legend()+dayList(st.sel);
  }
  return '<div class="top"><h1>'+esc(title)+'</h1><button class="ib" data-act="prev" aria-label="Назад">'+ico('left')+'</button><button class="ib" data-act="next" aria-label="Вперёд">'+ico('right')+'</button><button class="ib dim" data-act="settings" aria-label="Оформление">'+ico('gear')+'</button><button class="ib" data-act="new-ev" aria-label="Добавить событие">'+ico('plus')+'</button></div>'+

}
const legend=()=>'<div style="display:flex;gap:16px;font-size:13px;color:var(--muted)"><span style="display:flex;align-items:center;gap:6px"><i class="dot" style="background:var(--ink)"></i>Повторяющееся</span><span style="display:flex;align-items:center;gap:6px"><i class="ring" style="border-color:var(--ink)"></i>Разовое</span></div>';

function subjIcon(s,size){

const tasksOf=sid=>st.data.lessons.filter(l=>l.subjectId===sid).sort((a,b)=>(a.n??1e15)-(b.n??1e15)||(a.date||'').localeCompare(b.date||'')||(a.id<b.id?-1:1));

function weekLabel(d){const ws=weekStart(parse(d)),we=addD(ws,6);return 'Неделя '+ws.getDate()+(ws.getMonth()!==we.getMonth()?' '+MONG[ws.getMonth()]:'')+'–'+we.getDate()+' '+MONG[we.getMonth()]}
function vSubject(s){
  const c=s.color||P[3],fg=onC(c),ls=tasksOf(s.id);

  (mode==='photo'?

function picker(id,val,list){
  list=list||P;
  return '<div class="f"><label>Цвет</label><div class="sw" id="'+id+'-sw">'+list.map(c=>'<button type="button" data-act="pick" data-p="'+id+'" data-c="'+c+'" class="'+(c.toLowerCase()===val.toLowerCase()?'on':'')+'" style="background:'+c+'" aria-label="Цвет '+c+'"></button>').join('')+'<input type="color" id="'+id+'-native" value="'+esc(val.toLowerCase())+'" aria-label="Свой цвет"></div></div>'+
  '<div class="row2 f"><div><label for="'+id+'-hex">HEX</label><input id="'+id+'-hex" class="mono" value="'+esc(val.toUpperCase())+'" maxlength="7" autocomplete="off"></div><div class="row3"><div><label for="'+id+'-r">R</label><input id="'+id+'-r" inputmode="numeric" class="mono"></div><div><label for="'+id+'-g">G</label><input id="'+id+'-g" inputmode="numeric" class="mono"></div><div><label for="'+id+'-b">B</label><input id="'+id+'-b" inputmode="numeric" class="mono"></div></div></div>';
}
function setColor(id,h,from){
  if(!okHex(h))return;h=h.toUpperCase();
  if(sheet&&id!=='bg')sheet.color=h; if(id==='bg')st.bgDraft=h;
  const n=parseInt(h.slice(1),16),$=x=>document.getElementById(id+'-'+x);
  if(from!=='hex'&&$('hex'))$('hex').value=h;
  if(from!=='rgb'){$('r')&&($('r').value=(n>>16)&255);$('g')&&($('g').value=(n>>8)&255);$('b')&&($('b').value=n&255)}
  if(from!=='native'&&$('native'))$('native').value=h.toLowerCase();
  document.querySelectorAll('#'+id+'-sw button').forEach(b=>b.classList.toggle('on',b.dataset.c.toUpperCase()===h));
  const pv=document.getElementById('pv');if(pv&&id!=='bg'){pv.style.background=sheet.kind==='ev'&&sheet.type==='once'?'#fff':h;pv.style.color=sheet.kind==='ev'&&sheet.type==='once'?'var(--ink)':onC(h);pv.style.borderColor=h}
  if(id==='bg'){const bp=document.querySelector('.bgprev');if(bp){bp.style.background=h;const sp=bp.querySelector('span');if(sp){sp.textContent=h;sp.style.color=onC(h)}}}
}

function render(){
  if(st.edit)syncDraft();
  const app=document.getElementById('app');
  const ready=st.loaded.events&&st.loaded.subjects&&st.loaded.lessons&&st.loaded.expenses||st.offline;
  let h=st.view==='plan'?vPlan():st.view==='lessons'?vLessons():st.view==='interests'?vInterests():st.view==='words'?vWords():st.view==='money'?vMoney():vSettings();
  if(!ready)h+='<div class="note" style="margin-top:10px">Загружаю данные…</div>';
  if(st.offline)h='<div class="note" style="margin:10px 0">Память телефона недоступна, изменения не сохранятся. Не открывайте приложение в режиме «Частный доступ».</div>'+h;
  app.innerHTML=h;
  if(st.view==='settings'&&(st.bgTab||st.cfg.bgMode)==='color')setColor('bg',st.bgDraft||st.cfg.bgColor||'#FFFFFF','init');
  [['plan','calendar','План'],['lessons','school','Уроки'],['interests','bookmark','Интересы'],['words','words','Слова'],['money','wallet','Траты']].forEach(([v,i,t])=>{const b=document.getElementById('nav-'+v);b.innerHTML=ico(i)+t;b.classList.toggle('on',st.view===v||(v==='plan'&&st.view==='settings'));b.setAttribute('aria-current',st.view===v?'page':'false')});
  applyBg();
}

  const c=st.cfg;document.documentElement.style.setProperty('--op',c.bgMode==='photo'||c.bgMode==='color'&&c.bgColor&&c.bgColor.toUpperCase()!=='#FFFFFF'?c.op:1);

/* ---------- storage ---------- */
const IDB=(()=>{let p;
  const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('moy-ritm',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('files')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const tx=async(store,mode,fn)=>{const db=await open();return new Promise((res,rej)=>{const t=db.transaction(store,mode);const r=fn(t.objectStore(store));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})};
  return{get:(n,k)=>tx(n,'readonly',s=>s.get(k)),set:(n,k,v)=>tx(n,'readwrite',s=>s.put(v,k)),keys:n=>tx(n,'readonly',s=>s.getAllKeys())};
})();
const URLS={};const imgUrl=id=>URLS[id]||'';
async function persist(){try{await IDB.set('kv','state',{v:2,data:st.data,tomb:st.tomb,cfg:st.cfg})}catch(e){toast('Не удалось сохранить на телефоне')}}
async function put(col,id,obj){const arr=st.data[col];const i=arr.findIndex(x=>x.id===id);const o={...obj,id,u:Date.now()};i<0?arr.push(o):arr[i]=o;render();await persist();scheduleSync()}
async function del(col,id){st.data[col]=st.data[col].filter(x=>x.id!==id);(st.tomb[col]=st.tomb[col]||{})[id]=Date.now();render();await persist();scheduleSync()}
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const val=id=>(document.getElementById(id)?.value||'').trim();

async function save(){
  const s=sheet;if(!s)return;
  if(s.kind==='ev'){
    const title=val('ev-title');if(!title){toast('Введите название');return}
    const o={title,type:s.type,color:s.color,from:val('ev-from'),to:val('ev-to')};
    if(s.type==='once'){o.date=val('ev-date')||st.sel}else{if(!s.days.length){toast('Выберите хотя бы один день');return}o.days=[...s.days].sort();o.start=val('ev-start')||today();o.until=val('ev-until')||''}
    await put('events',s.id||newId('events'),o);
  }else if(s.kind==='subj'||s.kind==='fold'){
    const name=val('s-name');if(!name){toast('Введите название');return}
    const col=s.kind==='fold'?'ifolders':'subjects',ex=st.data[col].find(x=>x.id===s.id);
    await put(col,s.id||newId(),{name,icon:s.icon,iconAsset:s.itab==='photo'?s.iconAsset:null,color:s.color,order:ex?.order??st.data[col].length});
  }else if(s.kind==='les'){
    const topic=val('l-topic');if(!topic){toast('Введите наименование задания');return}
    const ex=st.data.lessons.find(x=>x.id===s.id),sid=s.sid||st.subj;
    const nn=ex&&ex.subjectId===sid&&ex.n!=null?ex.n:Math.max(0,...st.data.lessons.filter(x=>x.subjectId===sid).map(x=>x.n??0))+1;
    await put('lessons',s.id||newId('lessons'),{subjectId:sid,topic,desc:val('l-desc'),material:val('l-mat'),stop:val('l-stop'),done:!!(ex&&ex.done),n:nn});
  }else if(s.kind==='exp'){
    const amount=parseFloat(val('x-amount').replace(/\s/g,'').replace(',','.'));if(!(amount>0)){toast('Введите сумму');return}
    const ex=st.data.expenses.find(x=>x.id===s.id);
    await put('expenses',s.id||newId('expenses'),{title:val('x-title'),amount,category:s.cat,date:val('x-date')||today(),ts:ex?.ts||Date.now()});
  }
  closeSheet();toast('Сохранено');
}
async function remove(){
  const s=sheet,b=document.getElementById('delbtn');
  if(!s.confirm){s.confirm=1;b.textContent='Нажмите ещё раз, чтобы удалить';return}
  const map={ev:'events',subj:'subjects',les:'lessons',exp:'expenses',fold:'ifolders'};
  if(s.kind==='fold'){for(const x of st.data.notes.filter(x=>x.folderId===s.id))await del('notes',x.id);st.ifolder=null}
  if(s.kind==='subj'){for(const l of st.data.lessons.filter(l=>l.subjectId===s.id))await del('lessons',l.id);st.subj=null}
  await del(map[s.kind],s.id);closeSheet();toast('Удалено');
}

  try{const bmp=await createImageBitmap(file);const k=Math.min(1,(max||1600)/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',.86))}catch(e){return file}
}

/* ---------- sync with GitHub ----------
   data.json lives in a private repo. Every record carries u (last change time);
   deleted records leave a tombstone {id: time} so the deletion reaches other devices.
   GET  -> merge remote into local -> PUT back with the sha we read (409 = someone wrote first, retry). */
const SYNC_COLS=['events','subjects','lessons','expenses','ifolders','notes','words','wlinks'];
const ghUrl=()=>'https://api.github.com/repos/'+encodeURIComponent(st.sync.owner)+'/'+encodeURIComponent(st.sync.repo)+'/contents/data.json';
const ghHeaders=()=>({Authorization:'Bearer '+st.sync.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'});
const b64enc=str=>{const b=new TextEncoder().encode(str);let bin='';for(let i=0;i<b.length;i+=0x8000)bin+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(bin)};
const b64dec=str=>new TextDecoder().decode(Uint8Array.from(atob(str.replace(/\s/g,'')),c=>c.charCodeAt(0)));
async function saveSyncCfg(){try{await IDB.set('kv','sync',{...st.sync})}catch(e){}}
function merge(L,R){
  const out={data:{},tomb:{}},cut=Date.now()-90*864e5;
  for(const c of SYNC_COLS){
    const t={...((R.tomb||{})[c]||{})};
    for(const[k,v]of Object.entries((L.tomb||{})[c]||{}))if(!(t[k]>=v))t[k]=v;
    const m=new Map();
    for(const r of[...((R.data||{})[c]||[]),...((L.data||{})[c]||[])]){const o=m.get(r.id);if(!o||(r.u||0)>=(o.u||0))m.set(r.id,r)}
    out.data[c]=[...m.values()].filter(r=>!(t[r.id]>=(r.u||0)));
    for(const k in t)if(t[k]<cut)delete t[k];
    out.tomb[c]=t;
  }
  return out;
}
const norm=x=>JSON.stringify(SYNC_COLS.map(c=>[[...((x.data||{})[c]||[])].sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0),Object.entries((x.tomb||{})[c]||{}).sort()]));
const httpErr=code=>({msg:code===401?'Ключ не подходит или истёк. Создайте новый и подключите заново.':code===403?'У ключа нет права записи. Нужно Contents: Read and write.':code===404?'Репозиторий не найден. Проверьте название и что ключ выдан на него.':'GitHub ответил ошибкой '+code+'. Попробую позже.'});
const syncLabel=()=>!st.sync.token?'Синхронизация выключена':st.syncState==='ok'?'Синхронизировано · '+new Date(st.sync.last).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):(st.syncMsg||'Ожидание…');
function setSync(state,msg){st.syncState=state;st.syncMsg=msg||'';const el=document.getElementById('syncst');if(el)el.textContent=syncLabel()}
let syncing=false,syncAgain=false,syncT=null;
function scheduleSync(){if(!st.sync.token)return;clearTimeout(syncT);setSync('busy','Изменения ждут отправки…');syncT=setTimeout(syncNow,2500)}
async function syncNow(){
  if(!st.sync.token)return;
  if(syncing||blobBusy){syncAgain=true;return}
  syncing=true;clearTimeout(syncT);setSync('busy','Синхронизирую…');
  try{
    let done=false;
    for(let attempt=0;attempt<3&&!done;attempt++){
      // 1. GET: read the current file and its sha
      const r=await fetch(ghUrl()+'?t='+Date.now(),{headers:ghHeaders(),cache:'no-store'});
      let remote={data:{},tomb:{}},sha=null;
      if(r.status===200){const j=await r.json();sha=j.sha;try{const p=JSON.parse(b64dec(j.content));remote={data:p.data||{},tomb:p.tomb||{}}}catch(e){throw{msg:'Файл data.json на GitHub повреждён.'}}}
      else if(r.status!==404)throw httpErr(r.status);
      // 2. merge and apply locally right away (no await in between, so nothing typed meanwhile is lost)
      const local={data:st.data,tomb:st.tomb},m=merge(local,remote);
      const localChanged=norm(m)!==norm(local);
      st.data={...st.data,...m.data};st.tomb=m.tomb;
      if(localChanged){if(!st.edit)render();persist()}
      // 3. PUT: send the merged file only if GitHub's copy differs
      if(sha===null||norm(m)!==norm(remote)){
        const body={message:'Данные · '+new Date().toLocaleString('ru-RU'),content:b64enc(JSON.stringify({app:'ravens-priorities',v:2,updated:new Date().toISOString(),data:m.data,tomb:m.tomb},null,1))};
        if(sha)body.sha=sha;
        const w=await fetch(ghUrl(),{method:'PUT',headers:{...ghHeaders(),'Content-Type':'application/json'},body:JSON.stringify(body)});
        if(w.status===409||w.status===422)continue;
        if(!w.ok)throw httpErr(w.status);
        const wj=await w.json();st.sync.sha=wj.content&&wj.content.sha;
      }else st.sync.sha=sha;
      done=true;
    }
    if(!done)throw{msg:'Файл менялся с другого устройства. Попробую ещё раз позже.'};
    st.sync.last=Date.now();await saveSyncCfg();setSync('ok');syncing=false;await blobSync();
  }catch(e){setSync('err',e&&e.msg?e.msg:(e instanceof TypeError?'Нет сети. Отправлю, когда появится.':'Ошибка синхронизации.'))}
  finally{syncing=false;if(syncAgain&&!blobBusy){syncAgain=false;syncNow()}}
}

  const s=st.sync;
  if(!s.token)return '<div class="cap" style="padding-top:14px;border-top:1px solid var(--line);margin-top:8px">Синхронизация</div>'+
   '<div class="note" style="text-align:left">Записи будут храниться в вашем закрытом репозитории на GitHub и появятся на всех устройствах, где введён ключ. Фото остаются на каждом устройстве свои.</div>'+
   '<div class="row2 f"><div><label for="sy-owner">Владелец</label><input id="sy-owner" value="'+esc(s.owner)+'" autocomplete="off" autocapitalize="off"></div><div><label for="sy-repo">Репозиторий</label><input id="sy-repo" value="'+esc(s.repo)+'" autocomplete="off" autocapitalize="off"></div></div>'+
   '<div class="f"><label for="sy-token">Ключ доступа</label><input id="sy-token" type="password" placeholder="github_pat_…" autocomplete="off" autocapitalize="off" spellcheck="false"></div>'+
   '<button class="btn pri" data-act="sync-connect">Подключить</button>';
  return '<div class="cap" style="padding-top:14px;border-top:1px solid var(--line);margin-top:8px">Синхронизация · '+esc(s.owner+'/'+s.repo)+'</div>'+
   '<div class="note" style="text-align:left" id="syncst" role="status">'+esc(syncLabel())+'</div>'+
   '<button class="btn ghost" data-act="sync-now">Синхронизировать сейчас</button>'+
   '<button class="btn del" data-act="sync-off">Отключить на этом устройстве</button>';
}

function seedFolders(){
  // fixed ids and u=1: the same folders on every device, and any later edit or deletion wins over the seed
  if(st.cfg.seeded||st.data.ifolders.length)return;
  st.data.ifolders=TG_FOLDERS.map(([name,icon],i)=>({id:'tg'+i,name,icon,iconAsset:null,color:P[i%P.length],order:i,u:1}));
  st.cfg.seeded=1;persist();
}

const nrm=x=>String(x||'').toLowerCase().replace(/ё/g,'е');

function searchHtml(q){
  const qq=nrm(q.trim());if(!qq)return foldersHtml();
  const hl=(text)=>{const t=String(text||''),i=nrm(t).indexOf(qq);if(i<0)return null;const a=Math.max(0,i-50),b=Math.min(t.length,i+qq.length+80);
    return (a>0?'…':'')+esc(t.slice(a,i))+'<mark>'+esc(t.slice(i,i+qq.length))+'</mark>'+esc(t.slice(i+qq.length,b))+(b<t.length?'…':'')};
  const res=st.data.notes.filter(x=>nrm(x.title+'\n'+(x.source||'')+'\n'+noteText(x)).includes(qq)).sort((a,b)=>(b.n||0)-(a.n||0)).slice(0,60);
  if(!res.length)return '<div class="empty">Ничего не нашлось по запросу «'+esc(q.trim())+'».</div>';
  return '<div class="cap">Найдено: '+res.length+'</div><div class="stack" style="gap:8px">'+res.map(x=>{const f=st.data.ifolders.find(y=>y.id===x.folderId);
    const sub=(f?esc(f.name)+' · ':'')+(hl(noteText(x))||hl(x.source)||esc(noteSub(x).slice(0,120)));
    const title=hl(x.title)&&x.title.length<120?hl(x.title):esc(x.title);
    return '<button class="nrow" data-act="open-note" data-id="'+x.id+'"><span class="tp">'+title+'</span><span class="sub">'+sub+'</span></button>'}).join('')+'</div>';
}

/* editor <-> blocks: the editor is one rich field; inside the app a note is still a list of text and image blocks */
function blocksToHtml(blocks){
  return (blocks||[]).map(b=>b.t==='img'?(URLS[b.f]?'':(ensureBlob(b.f),''))+'<img data-f="'+esc(b.f)+'" src="'+(URLS[b.f]||'')+'" alt="">':esc(b.v).replace(/\n/g,'<br>')).join('');
}
function editorToBlocks(el){
  const out=[];let txt='';
  const flush=()=>{const v=txt.replace(/^\n+|\n+$/g,'');if(v.trim())out.push({t:'text',v});txt=''};
  const walk=n=>{
    for(const c of n.childNodes){
      if(c.nodeType===3)txt+=c.nodeValue.replace(/ /g,' ');
      else if(c.nodeName==='BR')txt+='\n';
      else if(c.nodeName==='IMG'){if(c.dataset.f){flush();out.push({t:'img',f:c.dataset.f})}}
      else if(c.nodeType===1){const blk=/^(DIV|P|LI|H\d|BLOCKQUOTE)$/.test(c.nodeName);if(blk&&txt&&!txt.endsWith('\n'))txt+='\n';walk(c);if(blk&&!txt.endsWith('\n'))txt+='\n'}
    }
  };
  walk(el);flush();return out;
}
function syncDraft(){const ed=document.getElementById('n-body');if(ed&&st.edit)st.edit.blocks=editorToBlocks(ed)}
let edRange=null;
document.addEventListener('selectionchange',()=>{const ed=document.getElementById('n-body'),sel=window.getSelection();if(ed&&sel&&sel.rangeCount&&ed.contains(sel.anchorNode))edRange=sel.getRangeAt(0).cloneRange()});
function insertAtCaret(node){
  const ed=document.getElementById('n-body');if(!ed)return;
  let r=edRange&&ed.contains(edRange.startContainer)?edRange:null;
  if(!r){r=document.createRange();r.selectNodeContents(ed);r.collapse(false)}
  r.deleteContents();r.insertNode(node);r.setStartAfter(node);r.collapse(true);
  const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);edRange=r.cloneRange();
}
async function storeImage(file){const blob=await shrink(file,2000),id=newId();await IDB.set('files',id,blob);URLS[id]=URL.createObjectURL(blob);return id}
async function inlineImage(file){
  if(!file||!st.edit)return;
  try{const id=await storeImage(file);const img=document.createElement('img');img.dataset.f=id;img.src=URLS[id];img.alt='';insertAtCaret(img)}
  catch(e){toast('Не удалось вставить фото')}
}
document.addEventListener('paste',e=>{
  const ed=e.target&&e.target.closest&&e.target.closest('#n-body');if(!ed)return;
  e.preventDefault();
  const items=[...((e.clipboardData&&e.clipboardData.items)||[])];
  const imgs=items.filter(i=>i.kind==='file'&&/^image\//.test(i.type)).map(i=>i.getAsFile()).filter(Boolean);
  const sel=window.getSelection();if(sel.rangeCount)edRange=sel.getRangeAt(0).cloneRange();
  if(imgs.length){(async()=>{for(const f of imgs)await inlineImage(f)})();return}
  const t=(e.clipboardData&&e.clipboardData.getData('text/plain'))||'';
  if(t)insertAtCaret(document.createTextNode(t));
});

  const id=e.id||newId(),ex=st.data.notes.find(y=>y.id===id);

}

/* ---------- words: a personal English dictionary ----------
   words:  {en, ru, blocks (same rich description as notes), source, n}
   wlinks: one record per pair of words, id = "a~b" (sorted), t = 'syn' | 'ant'.
   A link belongs to both words at once, so it is stored separately rather than inside either word. */
const lkey=(a,b)=>a<b?a+'~'+b:b+'~'+a;
const wById=id=>st.data.words.find(x=>x.id===id);
const wText=x=>(x.blocks||[]).filter(b=>b.t==='text').map(b=>b.v).join('\n');
const byEn=(a,b)=>nrm(a.en).localeCompare(nrm(b.en),'en');
function linksOf(id){return st.data.wlinks.filter(l=>l.a===id||l.b===id).map(l=>({w:l.a===id?l.b:l.a,t:l.t})).filter(l=>wById(l.w))}
function hlq(text,qq){const t=String(text||''),i=nrm(t).indexOf(qq);if(!qq||i<0)return null;const a=Math.max(0,i-40),b=Math.min(t.length,i+qq.length+70);
  return (a>0?'…':'')+esc(t.slice(a,i))+'<mark>'+esc(t.slice(i,i+qq.length))+'</mark>'+esc(t.slice(i+qq.length,b))+(b<t.length?'…':'')}
function wordRow(x,qq){
  const L=linksOf(x.id),names=t=>L.filter(l=>l.t===t).map(l=>wById(l.w)).sort(byEn).map(w=>w.en).join(', ');
  const syn=names('syn'),ant=names('ant');
  const en=(qq&&x.en.length<80&&hlq(x.en,qq))||esc(x.en),ru=x.ru?((qq&&hlq(x.ru,qq))||esc(x.ru)):'';
  const inDesc=qq&&!nrm(x.en).includes(qq)&&!nrm(x.ru).includes(qq)?hlq(wText(x),qq):null;
  return '<button class="nrow wrow" data-act="open-word" data-id="'+x.id+'"><span class="en" lang="en">'+en+'</span>'+(ru?'<span class="ru">'+ru+'</span>':'')+
    (inDesc?'<span class="sub">'+inDesc+'</span>':'')+(syn?'<span class="syn" lang="en">≈ '+esc(syn)+'</span>':'')+(ant?'<span class="syn" lang="en">≠ '+esc(ant)+'</span>':'')+'</button>';
}
function wordsListHtml(){
  if(!st.data.words.length)return '<div class="empty">Словарь пока пуст. Добавьте первое слово кнопкой «+».</div>';
  const qq=nrm(st.wq.trim());
  if(qq){
    const rank=x=>nrm(x.en).startsWith(qq)?0:nrm(x.en).includes(qq)?1:nrm(x.ru).includes(qq)?2:3;
    const res=st.data.words.filter(x=>nrm(x.en+'\n'+(x.ru||'')+'\n'+wText(x)+'\n'+(x.source||'')).includes(qq)).sort((a,b)=>rank(a)-rank(b)||byEn(a,b)).slice(0,80);
    const add='<button class="btn ghost" data-act="new-word-q">+ Добавить «'+esc(st.wq.trim())+'»</button>',cyr=/[а-я]/.test(qq);
    if(!res.length)return '<div class="empty">Такого слова пока нет.</div>'+add;
    return '<div class="stack" style="gap:8px">'+res.map(x=>wordRow(x,qq)).join('')+(cyr||res.some(x=>nrm(x.en)===qq)?'':add)+'</div>';
  }
  if(st.wsort==='new')return '<div class="stack" style="gap:8px">'+[...st.data.words].sort((a,b)=>(b.n||0)-(a.n||0)).map(x=>wordRow(x)).join('')+'</div>';
  let h='',last='';
  for(const x of [...st.data.words].sort(byEn)){const c=(nrm(x.en).match(/[a-zа-я0-9]/)||['#'])[0].toUpperCase();if(c!==last){h+='<div class="wletter">'+esc(c)+'</div>';last=c}h+=wordRow(x)}
  return '<div class="stack" style="gap:8px">'+h+'</div>';
}

  if(st.word){const x=wById(st.word);if(x)return vWord(x);st.word=null}
  return '<div class="top"><h1>Слова</h1><button class="ib" data-act="new-word" aria-label="Добавить слово">'+ico('plus')+'</button></div>'+

   '<div class="seg">'+[['abc','По алфавиту'],['new','Новые сверху']].map(x=>'<button class="'+(st.wsort===x[0]?'on':'')+'" data-act="wsort" data-s="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>'+

  return '<div><div class="wlbl">'+label+'</div><div class="wchips">'+ws.map(w=>'<button class="wchip'+(t==='ant'?' ant':'')+'" lang="en" data-act="goto-word" data-id="'+w.id+'">'+esc(w.en)+'</button>').join('')+'</div></div>';
}
function chipsEdit(t,label){
  const e=st.edit,ls=e.links.filter(l=>l.t===t).map(l=>({...l,name:l.stub?l.en:(wById(l.w)||{}).en||''})).sort((a,b)=>nrm(a.name).localeCompare(nrm(b.name),'en'));
  return '<div><div class="wlbl">'+label+'</div><div class="wchips">'+ls.map(l=>'<span class="wchip'+(t==='ant'?' ant':'')+'" lang="en">'+esc(l.name)+'<button type="button" class="rm" data-act="lk-del" data-w="'+l.w+'" aria-label="Убрать связь с '+esc(l.name)+'">'+ico('x')+'</button></span>').join('')+
   '<button type="button" class="wchip add" data-act="lk-add" data-t="'+t+'">+ Добавить</button></div></div>';
}
function vWord(x){
  const e=st.edit&&st.edit.kind==='word'?st.edit:null;

/* several changes at once: one render, one save, one sync */
async function commit(ops){
  const now=Date.now();
  for(const[op,col,id,obj]of ops){
    if(op==='put'){const arr=st.data[col],i=arr.findIndex(x=>x.id===id),o={...obj,id,u:now};i<0?arr.push(o):arr[i]=o}
    else{st.data[col]=st.data[col].filter(x=>x.id!==id);(st.tomb[col]=st.tomb[col]||{})[id]=now}
  }
  render();await persist();scheduleSync();
}
async function saveWord(){
  syncDraft();const e=st.edit;if(!e||e.kind!=='word')return;
  st.edit=null;
  const blocks=e.blocks.filter(b=>b.t!=='text'||b.v.trim()),en=e.en.trim(),ru=e.ru.trim(),source=e.source.trim();
  if(!en&&!ru&&!blocks.length&&!source&&!e.links.length)return;
  const now=Date.now(),ex=wById(e.id),ops=[];
  st.word=e.id;
  for(const l of e.links)if(l.stub&&!wById(l.w))ops.push(['put','words',l.w,{en:l.en,ru:'',blocks:[],source:'',n:now}]);
  ops.push(['put','words',e.id,{en:en||'(без слова)',ru,blocks,source,n:ex?.n??now}]);
  const want=new Map(e.links.map(l=>[lkey(e.id,l.w),l]));
  for(const l of st.data.wlinks)if((l.a===e.id||l.b===e.id)&&!want.has(l.id))ops.push(['del','wlinks',l.id]);
  for(const[k,l]of want){const cur=st.data.wlinks.find(y=>y.id===k);if(!cur||cur.t!==l.t){const[a,b]=k.split('~');ops.push(['put','wlinks',k,{a,b,t:l.t}])}}
  await commit(ops);
}

function lkRes(q){

  let list=st.data.words.filter(x=>!taken.has(x.id));

  const exists=qq&&(st.data.words.some(x=>nrm(x.en)===qq)||e.links.some(l=>l.stub&&nrm(l.en)===qq)||nrm(e.en)===qq);

/* ---------- photos and files in the private repo: files/<id> ---------- */
let up=new Set(),blobBusy=false;const pendingBlob=new Set();
const ghFile=id=>'https://api.github.com/repos/'+encodeURIComponent(st.sync.owner)+'/'+encodeURIComponent(st.sync.repo)+'/contents/files/'+encodeURIComponent(id);
async function saveUp(){try{await IDB.set('kv','up',[...up])}catch(e){}}
function noteBlobs(){const ids=[];for(const x of st.data.words)for(const b of x.blocks||[])if(b.t==='img')ids.push(b.f);for(const x of st.data.notes){for(const b of x.blocks||[])if(b.t==='img')ids.push(b.f);for(const p of x.photos||[])ids.push(p.f);for(const m of x.files||[])if(!(m.size>95e6))ids.push(m.f)}return ids}
async function blobSync(){
  if(!st.sync.token||blobBusy)return;
  blobBusy=true;
  try{
    for(const id of noteBlobs()){
      if(up.has(id))continue;
      const b=await IDB.get('files',id);if(!b)continue;
      setSync('busy','Отправляю фото и файлы…');
      const content=(await toDataURL(b)).split(',')[1]||'';
      const r=await fetch(ghFile(id),{method:'PUT',headers:{...ghHeaders(),'Content-Type':'application/json'},body:JSON.stringify({message:'Файл · '+id,content})});
      if(r.ok||r.status===422){up.add(id);await saveUp();continue}   // 422: already on GitHub
      if(r.status===409){syncAgain=true;break}                      // someone committed at the same moment: try later
      throw httpErr(r.status);
    }
    if(st.syncState==='busy')setSync('ok');
  }catch(e){setSync('err',e&&e.msg?e.msg:(e instanceof TypeError?'Нет сети. Отправлю файлы позже.':'Не удалось отправить файлы.'))}
  finally{blobBusy=false;if(syncAgain){syncAgain=false;setTimeout(syncNow,1500)}}
}
async function getBlob(id){
  let b=await IDB.get('files',id);
  if(!b&&st.sync.token){
    const r=await fetch(ghFile(id)+'?t='+Date.now(),{headers:{...ghHeaders(),Accept:'application/vnd.github.raw'},cache:'no-store'});
    if(!r.ok)throw httpErr(r.status);
    b=await r.blob();await IDB.set('files',id,b);up.add(id);saveUp();
  }
  return b||null;
}
async function ensureBlob(id){
  if(URLS[id]||pendingBlob.has(id)||!st.sync.token)return;
  pendingBlob.add(id);
  try{const b=await getBlob(id);if(b){URLS[id]=URL.createObjectURL(b);if(st.view==='interests'||st.view==='words')render()}}catch(e){}
  finally{pendingBlob.delete(id)}
}
async function fileAction(i,mode){
  const x=st.data.notes.find(y=>y.id===st.note),m=x&&x.files[i];if(!m)return;
  try{
    if(!URLS[m.f])toast('Загружаю файл…');
    const b=await getBlob(m.f);if(!b){toast('Файл есть только на другом устройстве');return}
    const type=m.type||(/\.pdf$/i.test(m.name)?'application/pdf':/\.epub$/i.test(m.name)?'application/epub+zip':b.type);
    const file=new File([b],m.name,{type});
    if(mode==='open'&&/pdf|image|text/.test(type)){const a=document.createElement('a');a.href=URL.createObjectURL(file);a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();return}
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]})}catch(e){}return}
    const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=m.name;document.body.appendChild(a);a.click();a.remove();
  }catch(e){toast(e&&e.msg?e.msg:'Не удалось открыть файл')}
}

/* ---------- drag to reorder folders ---------- */
let drag=null;
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest&&e.target.closest('#rlist .grip');if(!g)return;
  e.preventDefault();const row=g.closest('.rrow');
  drag={row,id:e.pointerId,y:e.clientY};row.classList.add('drag');
  try{g.setPointerCapture(e.pointerId)}catch(_){}
});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  e.preventDefault();
  const list=document.getElementById('rlist');if(!list)return;
  for(const r of list.children){
    if(r===drag.row)continue;
    const b=r.getBoundingClientRect(),mid=b.top+b.height/2;
    const before=drag.row.compareDocumentPosition(r)&Node.DOCUMENT_POSITION_PRECEDING;
    if(before&&e.clientY<mid){list.insertBefore(drag.row,r);break}
    if(!before&&e.clientY>mid){list.insertBefore(drag.row,r.nextSibling)}
  }
  if(e.clientY<70)window.scrollBy(0,-12);else if(e.clientY>innerHeight-130)window.scrollBy(0,12);
},{passive:false});
async function endDrag(e){
  if(!drag||(e&&e.pointerId!==drag.id))return;
  drag.row.classList.remove('drag');drag=null;
  const ids=[...document.querySelectorAll('#rlist .rrow')].map(r=>r.dataset.id);let changed=false;
  const now=Date.now();
  ids.forEach((id,i)=>{const f=st.data.ifolders.find(x=>x.id===id);if(f&&f.order!==i){f.order=i;f.u=now;changed=true}});
  if(changed){await persist();scheduleSync()}
}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
document.addEventListener('keydown',e=>{
  const g=e.target.closest&&e.target.closest('#rlist .grip');if(!g||!(e.key==='ArrowUp'||e.key==='ArrowDown'))return;
  e.preventDefault();const row=g.closest('.rrow'),list=row.parentNode;
  if(e.key==='ArrowUp'&&row.previousElementSibling)list.insertBefore(row,row.previousElementSibling);
  if(e.key==='ArrowDown'&&row.nextElementSibling)list.insertBefore(row.nextElementSibling,row);
  g.focus();drag={row,id:-1};endDrag();
});

  }
});
function updThumb(){const t=document.getElementById('sthumb');if(!t||!sheet)return;t.style.background=sheet.color;t.style.color=onC(sheet.color);t.innerHTML=subjIcon({icon:sheet.icon,iconAsset:sheet.itab==='photo'?sheet.iconAsset:null})}
document.addEventListener('input',e=>{
  const t=e.target,id=t.id||'';
  if(t.tagName==='TEXTAREA')grow(t);
  if(st.edit){if(id==='n-title')st.edit.title=t.value;else if(id==='n-src')st.edit.source=t.value;else if(t.dataset.blk!=null&&st.edit.blocks[+t.dataset.blk])st.edit.blocks[+t.dataset.blk].v=t.value}
  if(st.edit&&st.edit.kind==='word'){if(id==='w-en')st.edit.en=t.value;else if(id==='w-ru')st.edit.ru=t.value;else if(id==='w-src')st.edit.source=t.value}
  if(id==='wsearch'){st.wq=t.value;const r=document.getElementById('wresults');if(r)r.innerHTML=wordsListHtml()}
  if(id==='lk-q'){const r=document.getElementById('lk-res');if(r)r.innerHTML=lkRes(t.value)}
  if(id==='isearch'){st.q=t.value;const r=document.getElementById('iresults');if(r)r.innerHTML=st.q.trim()?searchHtml(st.q):foldersHtml()}
  if(id==='l-mat'){const a=document.getElementById('l-link');if(a){const ok=isUrl(t.value);a.hidden=!ok;a.href=ok?t.value.trim():'#'}}
  const m=id.match(/^(c|bg)-(hex|r|g|b|native)$/);
  if(m){const p=m[1],k=m[2];
    if(k==='hex'){let v=t.value.trim();if(v&&v[0]!=='#')v='#'+v;if(okHex(v))setColor(p,v,'hex')}
    else if(k==='native')setColor(p,t.value,'native');
    else{const g=x=>Math.max(0,Math.min(255,parseInt(document.getElementById(p+'-'+x).value)||0));setColor(p,'#'+[g('r'),g('g'),g('b')].map(n=>n.toString(16).padStart(2,'0')).join(''),'rgb')}
    if(sheet&&sheet.kind==='subj')updThumb();
  }
  if(id==='op'){document.getElementById('opv').textContent=t.value+'%';document.documentElement.style.setProperty('--op',t.value/100);clearTimeout(st.opT);st.opT=setTimeout(()=>saveCfg({op:t.value/100},1),400)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='bgfile')uploadImg(t.files[0],id=>{saveCfg({bgAsset:id,bgMode:'photo'});toast('Фон обновлён')});
  if(t.id==='importfile'){importBackup(t.files[0]);t.value=''}
  if(t.id==='inlimg'){inlineImage(t.files[0]);t.value=''}
  if(t.id==='addphoto'){addNotePhotos([...t.files]);t.value=''}
  if(t.id==='addfile'){addNoteFile(t.files[0]);t.value=''}
  if(t.id==='ifile')uploadImg(t.files[0],id=>{if(!sheet)return;sheet.iconAsset=id;sheet.itab='photo';updThumb();toast('Иконка загружена')});
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet)closeSheet()});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||!e.target||e.target.id!=='lk-q')return;e.preventDefault();const b=document.querySelector('#lk-res [data-act]');if(b)b.click()});

/* ---------- boot ---------- */
render();
(async()=>{
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  try{
    const saved=await IDB.get('kv','state');
    if(saved){Object.assign(st.data,saved.data||{});Object.assign(st.cfg,saved.cfg||{});if(saved.tomb)Object.assign(st.tomb,saved.tomb)}
    const sy=await IDB.get('kv','sync');if(sy)Object.assign(st.sync,sy);
    const u0=await IDB.get('kv','up');if(u0)up=new Set(u0);
    SYNC_COLS.forEach(c=>{if(!Array.isArray(st.data[c]))st.data[c]=[];st.tomb[c]=st.tomb[c]||{}});
    seedFolders();
    for(const k of await IDB.keys('files')){const b=await IDB.get('files',k);if(b)URLS[k]=URL.createObjectURL(b)}
  }catch(e){st.offline=true}
  st.assets=true;['events','subjects','lessons','expenses'].forEach(c=>st.loaded[c]=true);render();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(st.sync.token)syncNow();
})();
})();
</script>
